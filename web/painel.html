<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel ECLSS - Missão Marte</title>
</head>
<body>
    <h1>Controle de Suporte de Vida (ECLSS)</h1>
    <p>Estoque Atual de Oxigênio: <strong id="nivel-oxigenio">1000</strong> Litros</p>

    <form id="form-solicitacao">
        <label for="qtd-oxigenio">Solicitar Cota Extra (Litros):</label>
        <input type="number" id="qtd-oxigenio" name="qtd-oxigenio" required>
        <button type="submit" id="btn-solicitar">Solicitar Cota</button>
    </form>

    <div id="mensagem-status" style="margin-top: 15px; font-weight: bold;"></div>

    <script>
        document.getElementById('form-solicitacao').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('qtd-oxigenio');
            const nivelEl = document.getElementById('nivel-oxigenio');
            const msgEl = document.getElementById('mensagem-status');

            const solicitado = parseFloat(input.value);
            const atual = parseFloat(nivelEl.innerText);

            // Simula um pequeno atraso de processamento para testar WebDriverWait
            setTimeout(() => {
                if (solicitado > 0 && solicitado <= atual) {
                    const novoSaldo = atual - solicitado;
                    nivelEl.innerText = novoSaldo;
                    msgEl.innerText = "Solicitação aprovada! Novo estoque: " + novoSaldo + "L";
                    msgEl.style.color = "green";
                } else {
                    msgEl.innerText = "Erro: Quantidade inválida ou estoque insuficiente.";
                    msgEl.style.color = "red";
                }
            }, 300);
        });
    </script>
</body>
</html>
